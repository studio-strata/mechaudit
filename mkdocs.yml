site_name: MechAudit
site_description: Finite mechanism design, auditing, and optimal-face diagnostics
site_author: Alessio Staffini
site_url: https://studio-strata.github.io/mechaudit/
repo_name: studio-strata/mechaudit
repo_url: https://github.com/studio-strata/mechaudit
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Alessio Staffini
theme:
  name: material
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - Audit a mechanism: auditing.md
  - Design a mechanism: designing.md
  - Optimal-face analysis: optimal-face.md
  - Numerical diagnostics: numerical-health.md
  - Benchmarks: benchmarks.md
  - API reference: api.md
  - Methodology: methodology.md
  - Project and support: project.md
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
strict: true
