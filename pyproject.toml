[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mechaudit"
dynamic = ["version"]
description = "Finite mechanism design with exhaustive IC/IR auditing and invariant optimal-face diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Alessio Staffini" },
]
maintainers = [
  { name = "Alessio Staffini" },
]
keywords = [
  "economics",
  "mechanism-design",
  "linear-programming",
  "incentive-compatibility",
  "optimization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "highspy>=1.8,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scipy>=1.11,<2",
]

[project.urls]
Homepage = "https://github.com/studio-strata/mechaudit"
Documentation = "https://studio-strata.github.io/mechaudit/"
Repository = "https://github.com/studio-strata/mechaudit"
Issues = "https://github.com/studio-strata/mechaudit/issues"
Changelog = "https://github.com/studio-strata/mechaudit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
xarray = ["xarray>=2023.9"]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
test = [
  "hypothesis>=6.100",
  "jsonschema>=4.23,<5",
  "pytest>=8.2",
  "pytest-cov>=5",
  "tomli>=2.0; python_version < '3.11'",
]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "jsonschema>=4.23,<5",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
  "tomli>=2.0; python_version < '3.11'",
  "twine>=5.1",
  "xarray>=2023.9",
]

[tool.hatch.version]
path = "src/mechaudit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mechaudit"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/mechaudit-report-v1.schema.json" = "mechaudit/schemas/mechaudit-report-v1.schema.json"

[tool.hatch.build.targets.sdist]
exclude = ["/output", "/paper", "/tmp"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
xfail_strict = true
markers = [
  "slow: auxiliary-solve or property tests that take more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["mechaudit"]

[tool.coverage.report]
fail_under = 85
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
# Static analysis uses the CI quality interpreter; the runtime matrix covers 3.10+.
python_version = "3.13"
packages = ["mechaudit"]
strict = true
warn_unreachable = true
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
module = ["highspy.*", "scipy.*", "pandas.*", "xarray.*"]
ignore_missing_imports = true
